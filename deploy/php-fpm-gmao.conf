; ═══════════════════════════════════════════════════════════════════════════════
; Larka — Pool PHP-FPM (production)
; ═══════════════════════════════════════════════════════════════════════════════
; Copier dans /etc/php/8.3/fpm/pool.d/gmao.conf
; puis : systemctl restart php8.3-fpm

[gmao]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-gmao.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Timeout
request_terminate_timeout = 300

; PHP settings
php_admin_value[error_log] = /var/www/gmao/data/logs/php_errors.log
php_admin_flag[log_errors] = on
; Limites d'upload : 'php_value' (et non 'php_admin_value') pour autoriser
; l'override via le fichier .user.ini écrit par le SuperAdmin depuis l'UI.
php_value[memory_limit] = 512M
php_value[upload_max_filesize] = 500M
php_value[post_max_size] = 512M
php_value[max_execution_time] = 300
php_value[max_input_time] = 300
php_admin_value[session.save_path] = /var/www/gmao/data/sessions
php_admin_value[session.gc_maxlifetime] = 86400
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = Lax

; Désactiver les fonctions dangereuses
;
; ⚠️ CETTE LISTE LAISSAIT PASSER proc_open, ET LA RAISON N'EXISTE PLUS.
;
; Elle expliquait que le « mode strict » des modules reposait dessus : proc_open
; lançait le processus isolé qui exécutait le code d'auteur, et le désactiver
; aurait supprimé le bac à sable. C'était vrai tant qu'un module contenait du
; code.
;
; Un module est aujourd'hui un fichier de données — une déclaration JSON que
; Larka interprète. Il n'y a plus de code tiers, donc plus de processus isolé,
; donc plus rien à lancer : le fichier api/extensions/Isole.php a disparu avec
; le mécanisme. proc_open réintègre donc la liste, et le pool retrouve le
; durcissement que ce commentaire lui refusait.
;
; Aucune fonction de cette liste n'est utilisée par Larka. La sauvegarde des
; fichiers, qui appelait « tar » par exec(), passe désormais par PharData —
; intégré à PHP, sans shell. Elle fonctionnait donc rarement ici : exec était
; déjà désactivé, et la sauvegarde annonçait « tar absent » à chaque passage.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,popen,proc_open,pcntl_exec,dl
