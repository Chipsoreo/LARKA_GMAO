# ═══════════════════════════════════════════════════════════════════════════════
# Larka — Configuration Nginx (production) — v1.3 durcie
# ═══════════════════════════════════════════════════════════════════════════════
# Copier dans /etc/nginx/sites-available/gmao puis :
#   ln -s /etc/nginx/sites-available/gmao /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Adapter : server_name, root, ssl_certificate*
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name gmao.example.com;
    location / { return 301 https://$host$request_uri; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
}

server {
    listen 443 ssl http2;
    server_name gmao.example.com;

    # ── SSL (Let's Encrypt) ─────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/gmao.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gmao.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    # ── Headers de sécurité ─────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy       "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
    # La CSP détaillée est émise par config.php côté PHP pour rester alignée avec config.json

    # ── Racine ──────────────────────────────────────────────────────────────
    root /var/www/gmao;
    index index.html;
    charset utf-8;
    client_max_body_size 500M;

    # Masquer la version Nginx
    server_tokens off;

    # ── Compression ─────────────────────────────────────────────────────────
    # Réduit ~70-80 % le poids des assets texte (JS/CSS/SVG/JSON).
    # Sur ce projet : ~2,2 Mo de JS non compressés → ~500 Ko en gzip.
    gzip              on;
    gzip_vary         on;            # émet "Vary: Accept-Encoding" (caches/CDN)
    gzip_comp_level   6;             # bon compromis CPU / ratio
    gzip_min_length   1024;          # ne pas compresser les tout petits fichiers
    gzip_proxied      any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/manifest+json application/x-web-app-manifest+json
        image/svg+xml font/ttf application/vnd.ms-fontobject;

    # Brotli : meilleur ratio que gzip si le module est installé
    # (Debian/Ubuntu : `apt install libnginx-mod-http-brotli`).
    # Décommenter une fois le module présent :
    # brotli            on;
    # brotli_comp_level 5;
    # brotli_types      text/plain text/css text/javascript
    #                   application/javascript application/json
    #                   application/manifest+json image/svg+xml font/ttf;

    # ════════════════════════════════════════════════════════════════════════
    # ⚠️ BLOCAGE FICHIERS SENSIBLES — DOIT ÊTRE EN TÊTE
    # Nginx : sur location ~ de même priorité, le PREMIER matché gagne.
    # Ces blocs doivent donc venir AVANT le location ~ \.php$.
    # ════════════════════════════════════════════════════════════════════════

    # Fichiers cachés et de config versionnés
    location ~ /\.                      { deny all; return 404; }

    # Secrets applicatifs (correspondance exacte = priorité maximale)
    location = /config.json             { deny all; return 404; }
    location = /config.example.json     { deny all; return 404; }
    location = /tenants.json            { deny all; return 404; }
    location = /.env                    { deny all; return 404; }
    location = /.env.example            { deny all; return 404; }
    location = /composer.json           { deny all; return 404; }
    location = /composer.lock           { deny all; return 404; }
    location = /package.json            { deny all; return 404; }
    location = /README.md               { deny all; return 404; }

    # Dossiers privés (prefix ^~ = bat tous les regex)
    location ^~ /data/                  { deny all; return 404; }
    location ^~ /deploy/                { deny all; return 404; }
    location ^~ /logs/                  { deny all; return 404; }
    location ^~ /backups/               { deny all; return 404; }
    location ^~ /vendor/                { deny all; return 404; }

    # Outils de développement et documentation : normalement absents d'une
    # installation, puisque install.sh les exclut de la copie. Ce refus est une
    # ceinture par-dessus la bretelle, pour les déploiements faits à la main.
    location ^~ /outils/                { deny all; return 404; }
    location ^~ /Documentations/        { deny all; return 404; }

    # ── Modules communautaires ───────────────────────────────────────────────
    # Le contenu installé d'un module vit sous data/ (déjà refusé ci-dessus) :
    # aucune URL ne mène à un fichier de module, et son unique ressource — une
    # image — passe par la route « ext_image ».
    #
    # ⚠️ CE BLOC SERVAIT ENCORE DU JAVASCRIPT ET DU CSS DE MODULE.
    #
    # L'exception ouvrait /extensions/<id>/client|assets/*.{js,css,svg,…} au
    # motif qu'un module livrait son propre code client. Ce n'est plus vrai :
    # un module est une déclaration JSON, son paquet ne peut contenir ni .js,
    # ni .css, ni .svg, et son unique ressource — une image matricielle — n'est
    # pas servie par ce chemin mais par la route « ext_image », qui exige une
    # session, vérifie les octets et pose une CSP.
    #
    # Une exception qui ne peut plus rien servir de légitime ne sert plus qu'à
    # servir ce qui ne devrait pas l'être : un .js déposé à la main, restauré
    # d'une vieille sauvegarde, ou glissé là par erreur. Le dossier est donc
    # refusé en entier.
    location ^~ /extensions/              { deny all; return 404; }
    location ~* \.larka$                  { deny all; return 404; }
    location ~* \.larka_thematique$       { deny all; return 404; }
    location ~* \.phar$                   { deny all; return 404; }

    # « securite/ » et « sdk/ » n'existent plus dans le produit : ces dossiers
    # sont partis avec le bac à sable navigateur et le SDK d'auteur. Les refus
    # qui les visaient, dont une exception pour une page d'épreuve supprimée,
    # ont été retirés — une règle qui protège un chemin inexistant se recopie
    # de version en version et finit par masquer celles qui comptent.
    location ^~ /node_modules/          { deny all; return 404; }

    # Extensions interdites en téléchargement direct
    location ~* \.(pem|key|crt|p12|pfx|sql|sql\.gz|bak|backup|old|orig|log|dump|ini|conf)$ {
        deny all; return 404;
    }

    # Diagnostic : bloqué par défaut (décommenter allow pour l'exposer à une IP admin)
    location = /api/diagnostic.php {
        # allow 203.0.113.42;   # IP autorisée (exemple)
        deny all;
        return 404;
    }

    # ════════════════════════════════════════════════════════════════════════
    # ROUTES APPLICATIVES
    # ════════════════════════════════════════════════════════════════════════

    # API PHP — tout /api/* passe par index.php
    location /api/ {
        try_files $uri /api/index.php?$query_string;
    }

    # OAuth callbacks
    # Les URL de retour sont SANS extension (redirect_uri = /oauth/microsoft,
    # /oauth/google). On les réécrit en interne vers le fichier .php
    # correspondant, qui est ensuite exécuté par le bloc FastCGI whitelisté
    # ci-dessous. Sans ça, try_files cherche un fichier "oauth/microsoft"
    # inexistant → 404 sur le retour de connexion Microsoft/Google.
    location = /oauth/microsoft { rewrite ^ /oauth/microsoft.php last; }
    location = /oauth/google    { rewrite ^ /oauth/google.php    last; }

    # Toute autre URL sous /oauth/ n'a pas de fichier statique légitime.
    location /oauth/ {
        try_files $uri =404;
    }

    # Router PHP — UNIQUEMENT les points d'entrée légitimes (whitelist)
    # Bloque l'exécution d'un éventuel .php uploadé ou d'un fichier legacy
    location ~ ^/(api/index|router|oauth/microsoft|oauth/google)\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-gmao.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        include fastcgi_params;
        # Assistant IA local : jusqu'à quelques minutes sur CPU. Le streaming
        # envoie un ping toutes les 5 s, mais le repli JSON n'en a pas.
        fastcgi_read_timeout 300;

        # Hardening FastCGI
        fastcgi_hide_header X-Powered-By;
        fastcgi_param HTTP_PROXY "";
    }

    # Tout autre .php → refusé (empêche l'exécution d'un fichier uploadé renommé .php)
    location ~ \.php$ {
        deny all;
        return 404;
    }

    # ── HTML d'entrée : JAMAIS mis en cache long ────────────────────────────
    # index.html épingle les versions ?v=N de tous les scripts/CSS. S'il est
    # mis en cache par le navigateur (caching heuristique par défaut faute
    # d'en-tête explicite), l'utilisateur continue de charger les ANCIENNES
    # versions d'assets et ne voit jamais un déploiement tant que son cache
    # HTML n'expire pas. On force donc une revalidation à chaque chargement :
    # la page (petite) est revérifiée, mais les assets versionnés restent,
    # eux, en cache long (bloc ci-dessous). C'est le bon compromis SPA.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Pages HTML annexes (manuel, etc.) : même politique de fraîcheur.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Cache statiques ─────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Service Worker : pas de cache long (sinon les mises à jour passent pas)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Logo : /icon.png. iOS et d'anciennes configurations demandent encore
    # /apple-touch-icon.png : on sert le même fichier.
    location = /apple-touch-icon.png { rewrite ^ /icon.png last; }

    # Manifest PWA : cache court
    location = /manifest.webmanifest {
        expires 1h;
        add_header Cache-Control "public";
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    # Sert le contenu d'index.html pour toute route inconnue (deep-link, refresh
    # sur une URL signet…). On y applique la même politique no-cache, sinon ces
    # réponses HTML seraient mises en cache par heuristique et re-épingleraient
    # d'anciennes versions d'assets (cf. bloc `location = /index.html`).
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # ── Logs ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/gmao_access.log;
    error_log  /var/log/nginx/gmao_error.log;
}
