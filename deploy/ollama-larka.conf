# ═══════════════════════════════════════════════════════════════════════════════
# Larka — Réglages Ollama recommandés (inférence CPU, 8 vCPU / 16 Go RAM)
#
# Installation (drop-in systemd, ne modifie pas le service d'origine) :
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp deploy/ollama-larka.conf /etc/systemd/system/ollama.service.d/larka.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# Vérification :  ollama ps   (le modèle doit rester chargé, "100% CPU")
# ═══════════════════════════════════════════════════════════════════════════════
[Service]

# UNE seule requête d'inférence à la fois. C'est LE réglage le plus important ici :
#  1. Par défaut Ollama peut ouvrir 4 slots parallèles → la fenêtre de contexte
#     est DIVISÉE entre eux (8192/4 = 2048 par slot !) et le cache de préfixe
#     (KV cache) est évincé entre les tours de tool calling → chaque tour
#     re-traite TOUT le prompt depuis zéro (= minutes de CPU à 100 %).
#  2. Avec 8 vCPU déjà saturés par une inférence, paralléliser ne fait que
#     ralentir tout le monde.
# Avec 1 slot : les tours successifs d'une même question réutilisent le cache
# du préfixe commun → seuls les nouveaux tokens sont traités. Larka garde ce
# préfixe (prompt système + outils) IDENTIQUE d'une question à l'autre et le
# préchauffe à l'ouverture du panneau : une question ne coûte plus que ses
# propres tokens (quelques dizaines) au lieu de ~3 000.
Environment="OLLAMA_NUM_PARALLEL=1"

# Fenêtre de contexte : le prompt Larka + schémas d'outils + historique dépassent
# les 4096 par défaut (troncature silencieuse sinon).
Environment="OLLAMA_CONTEXT_LENGTH=8192"

# Garde le modèle en RAM en permanence (~2,5 Go pour Ministral 3B Q4).
# Sans ça : déchargé après 5 min d'inactivité → +30-60 s à la question suivante.
Environment="OLLAMA_KEEP_ALIVE=-1"

# Un seul modèle chargé à la fois (économise la RAM sur une machine 16 Go
# qui héberge aussi PostgreSQL et PHP).
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# Cache KV quantifié en 8 bits : ~2× moins de RAM pour le contexte,
# perte de qualité négligeable. (Nécessite Ollama >= 0.5.)
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_FLASH_ATTENTION=1"
